name: field_log
description: >-
  Field log: an offline-first notebook for recording wildlife sightings on a
  drive, built against the Chisimba field guiding service contract.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State. Riverpod is the declared state container; see the Flutter mapping
  # table in chisimba-info/docs/mobile-design/README.md.
  flutter_riverpod: ^3.4.3

  # Local store. Drift is the replica of record: the client is a local-first
  # reader and the service is a replica, not the other way round.
  drift: ^2.35.1

  # SQLite for the device. Drift itself only speaks to the `sqlite3` package;
  # this supplies the actual shared library on Android, where the platform has
  # no system SQLite to link against. Declared explicitly rather than left to a
  # transitive resolve so the dependency is visible where drift is.
  sqlite3_flutter_libs: ^0.5.42

  # Where the database file lives. Both are needed only to join a directory to a
  # file name; the store deliberately does not care about the rest of the path.
  path_provider: ^2.1.6
  path: ^1.9.1

  # Transport. Dio carries the batched pull and push endpoints, including their
  # partial-success responses.
  dio: ^5.11.1

  # Generated immutable models. freezed 4 requires `abstract class X with _$X`;
  # see TOOLCHAIN.md for why this is not a style preference. freezed 4 pairs
  # with freezed_annotation 3.1.0 exactly, so both are declared here rather
  # than relying on the transitive resolution.
  freezed: ^4.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Device-generated entity ids. The contract requires a client to mint its own
  # entity ids from the start, so that a queued operation can name its subject
  # before the server has ever heard of it.
  uuid: ^4.6.0

  # The basemap. The design prototype deliberately ships no basemap, on the
  # grounds that offline is the point. A real map is more use to a trainee than
  # contour bands alone, so tiles are layered over the vector work rather than
  # replacing it: OSM raster tiles need no API key, no billing account, and no
  # per-request dependency on anyone's servers. Tiles are cached to disk and
  # anything not cached falls back to the vector layer, so the map is never
  # blank in the field, which is the one situation the design cares most about.
  flutter_map: ^8.3.2
  # Declared directly because MapScreen names LatLng. flutter_map's barrel
  # does not re-export it even though its own source uses it, so importing
  # it transitively would be relying on a package's private arrangement.
  latlong2: ^0.9.1
  # Reading and writing the tile cache directory as files, since a cached tile
  # is bytes on disk rather than a row anywhere.
  http: ^1.2.2
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true